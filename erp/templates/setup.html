{% extends "base.html" %}
{% block title %}First-time setup{% endblock %}
{% block solo %}
<form method="post" class="card narrow">
  {{ csrf_field() }}
  <h2>Welcome</h2>
  <p class="muted">Create the main admin login. You can add staff and sales reps afterwards.</p>
  <label>Company name<input name="company_name" required></label>
  <label>Your name<input name="name" required></label>
  <label>Username<input name="username" required autocomplete="username"></label>
  <label>Password (8+ characters)<input type="password" name="password" required autocomplete="new-password"></label>
  <label>Repeat password<input type="password" name="password2" required autocomplete="new-password"></label>
  <button class="btn wide">Create admin and start</button>
</form>
{% endblock %}
